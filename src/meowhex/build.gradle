plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
}

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.theillusivec4.top" }
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://cursemaven.com" }
    maven { url = "https://dvs1.progwml6.com/files/maven/" }
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url = "https://modmaven.dev" }
    maven { url = "https://jitpack.io" }
    flatDir { dir "libs" }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"

    // Core deps (раньше были flatDir libs в форке — теперь через maven)
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "com.illusivesoulworks.caelus:caelus-neoforge:${caelus_version}"
    implementation "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // Patchouli + Paucal — required ядром (maven + flatDir-фолбэк)
    implementation "vazkii.patchouli:Patchouli:1.21.1-${patchouli_version}-NEOFORGE"
    compileOnly files("libs/Patchouli-1.21.1-93-NEOFORGE.jar")
    implementation files("libs/paucal-0.7.0+neoforge-1.21.1.jar")

    // Create — optional, для depot-интеграции
    compileOnly("com.simibubi.create:create-1.21.1:${create_version}") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    runtimeOnly("com.simibubi.create:create-1.21.1:${create_version}")
    runtimeOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")

    // ApothicAttributes + Placebo — optional, интеграция атрибутов (compile + dev-ран)
    compileOnly files("libs/ApothicAttributes-1.21.1-${apothic_version}.jar")
    compileOnly files("libs/Placebo-1.21.1-${placebo_version}.jar")
    runtimeOnly files("libs/ApothicAttributes-1.21.1-${apothic_version}.jar")
    runtimeOnly files("libs/Placebo-1.21.1-${placebo_version}.jar")

    // Apofix — addon-атрибуты маны поверх Apothic; интеграция мягкая (без
    // compile-зависимости, только lookup по ResourceLocation), в dev-ране грузится как мод
    runtimeOnly files("libs/Apofix-1.21.1-${apofix_version}.jar")

    compileOnly "org.spongepowered:mixin:0.8.5"
    compileOnly "org.jetbrains:annotations:23.0.0"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

kotlin {
    jvmToolchain(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = "21"
}

neoForge {
    version = neoforge_version
    validateAccessTransformers = false

    runs {
        client {
            client()
            gameDirectory = file("run")
            programArgument('--username')
            programArgument('Dev1')
        }
        client2 {
            client()
            gameDirectory = file("run2")
            programArgument('--username')
            programArgument('Dev2')
        }
        server {
            server()
            gameDirectory = file("run")
        }
        data {
            data()
            gameDirectory = file("run")
        }
    }

    mods {
        meowhex {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main.java.setSrcDirs(["src/main/java"])
    main.kotlin.setSrcDirs(["src/main/java"])
    // датаген форка в единый модуль не тянем (как в Common/Forge);
    // НО interop/patchouli компилируем: там PatternProcessor и др. для страниц книги
    // (в форке их исключал Common, а дособирал Forge через include).
    main.java.exclude "at/petrak/hexcasting/datagen/**"
    main.kotlin.exclude "at/petrak/hexcasting/datagen/**"
    main.java.exclude "at/petrak/hexcasting/mixin/accessor/client/AccessorCompositeRenderType.java"
    main.java.exclude "at/petrak/hexcasting/mixin/accessor/client/AccessorEmptyTextureStateShard.java"
    main.java.exclude "at/petrak/hexcasting/forge/datagen/**"
    main.kotlin.exclude "at/petrak/hexcasting/forge/datagen/**"
    main.java.exclude "at/petrak/hexcasting/forge/cap/ForgeCapabilityHandler.java"
    main.java.exclude "at/petrak/hexcasting/forge/cap/HexCapabilities.java"
    main.java.exclude "at/petrak/hexcasting/forge/cap/adimpl/CapClientCastingStack.java"
    main.java.exclude "at/petrak/hexcasting/forge/recipe/ForgeModConditionalIngredient.java"
    main.java.exclude "at/petrak/hexcasting/forge/recipe/ForgeUnsealedIngredient.java"
    main.java.exclude "at/petrak/hexcasting/forge/mixin/ForgeMixinDatagenModLoader.java"
    main.java.exclude "at/petrak/hexcasting/forge/mixin/ForgeMixinTagsProvider.java"
    main.resources.srcDirs += ["src/generated/resources"]
}

tasks.named("processResources").configure {
    inputs.property "version", mod_version
    inputs.property "neoforge_loader_range", neoforge_loader_range
    inputs.property "minecraft_range", minecraft_range

    // 1.21: plural data dirs -> singular, forge loot_modifiers -> neoforge
    // (порт логики Forge/build.gradle из форка в единый модуль)
    eachFile { details ->
        if (details.path.startsWith("data/")) {
            details.path = details.path
                .replace("/advancements/", "/advancement/")
                .replace("/item_modifiers/", "/item_modifier/")
                .replace("/loot_tables/", "/loot_table/")
                .replace("/recipes/", "/recipe/")
                .replace("/tags/blocks/", "/tags/block/")
                .replace("/tags/entity_types/", "/tags/entity_type/")
                .replace("/tags/fluids/", "/tags/fluid/")
                .replace("/tags/game_events/", "/tags/game_event/")
                .replace("/tags/items/", "/tags/item/")
                .replace("data/forge/loot_modifiers/", "data/neoforge/loot_modifiers/")
        }
    }

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": mod_version, "neoforge_loader_range": neoforge_loader_range, "minecraft_range": minecraft_range
    }

    doLast {
        def jsonSlurper = new groovy.json.JsonSlurper()
        def jsonOutput = groovy.json.JsonOutput
        def resourcesDir = destinationDir

        def rewrite = { File file, Object json ->
            file.setText(jsonOutput.prettyPrint(jsonOutput.toJson(json)) + System.lineSeparator(), "UTF-8")
        }

        def removeEmptyDirs
        removeEmptyDirs = { File dir ->
            dir.listFiles()?.each { child ->
                if (child.isDirectory()) removeEmptyDirs(child)
            }
            if (dir.exists() && dir.isDirectory() && (dir.listFiles() == null || dir.listFiles().length == 0)) {
                dir.delete()
            }
        }

        def fixItemStackLike
        fixItemStackLike = { Object node ->
            if (node instanceof Map) {
                if (node.containsKey("item") && !node.containsKey("id")) {
                    node["id"] = node.remove("item")
                }
                node.values().each { fixItemStackLike(it) }
            } else if (node instanceof List) {
                node.each { fixItemStackLike(it) }
            }
        }

        def containsTypedNode
        containsTypedNode = { Object node, String type ->
            if (node instanceof Map) {
                if (node["type"] == type) return true
                return node.values().any { containsTypedNode(it, type) }
            } else if (node instanceof List) {
                return node.any { containsTypedNode(it, type) }
            }
            return false
        }

        def remapCommonTags
        remapCommonTags = { Object node ->
            if (node instanceof Map) {
                if (node["tag"] instanceof String && node["tag"].startsWith("forge:")) {
                    def tagPath = node["tag"].substring("forge:".length())
                    node["tag"] = "c:" + (tagPath == "leather" ? "leathers" : tagPath)
                }
                node.values().each { remapCommonTags(it) }
            } else if (node instanceof List) {
                node.each { remapCommonTags(it) }
            }
        }

        def fixItemPredicates
        fixItemPredicates = { Object node ->
            if (node instanceof Map) {
                if (node.containsKey("tag") && !node.containsKey("items")) {
                    node["items"] = "#" + node.remove("tag")
                }
                node.values().each { fixItemPredicates(it) }
            } else if (node instanceof List) {
                node.each { fixItemPredicates(it) }
            }
        }

        def recipeRoot = new File(resourcesDir, "data")
        fileTree(recipeRoot).matching { include "**/recipe/**/*.json" }.files.each { file ->
            def json = jsonSlurper.parseText(file.getText("UTF-8"))
            def type = json instanceof Map ? json["type"] : null
            if (type == "forge:conditional"
                || containsTypedNode(json, "hexcasting:mod_conditional")) {
                file.delete()
                return
            }
            remapCommonTags(json)
            if (json instanceof Map && json["result"] != null) {
                if (json["result"] instanceof String) {
                    def result = ["id": json["result"]]
                    if (json["count"] != null) {
                        result["count"] = json.remove("count")
                    }
                    json["result"] = result
                } else {
                    fixItemStackLike(json["result"])
                }
            }
            rewrite(file, json)
        }

        fileTree(resourcesDir).matching {
            include "data/**/loot_modifiers/**/*.json"
        }.files.each { file ->
            def json = jsonSlurper.parseText(file.getText("UTF-8"))
            def remapLootConditions
            remapLootConditions = { Object node ->
                if (node instanceof Map) {
                    if (node["condition"] == "forge:loot_table_id") {
                        node["condition"] = "neoforge:loot_table_id"
                    }
                    node.values().each { remapLootConditions(it) }
                } else if (node instanceof List) {
                    node.each { remapLootConditions(it) }
                }
            }
            remapLootConditions(json)
            rewrite(file, json)
        }

        def writeTag = { String path, List<String> values ->
            def file = new File(resourcesDir, "data/c/tags/item/${path}.json")
            file.parentFile.mkdirs()
            rewrite(file, ["values": values])
        }

        writeTag("dusts/glowstone", ["minecraft:glowstone_dust"])
        writeTag("dyes/brown", ["minecraft:brown_dye"])
        writeTag("ingots/copper", ["minecraft:copper_ingot"])
        writeTag("ingots/gold", ["minecraft:gold_ingot"])
        writeTag("ingots/iron", ["minecraft:iron_ingot"])
        writeTag("leathers", ["minecraft:leather"])
        writeTag("nuggets/gold", ["minecraft:gold_nugget"])
        writeTag("nuggets/iron", ["minecraft:iron_nugget"])
        writeTag("rods/wooden", ["minecraft:stick"])

        fileTree(resourcesDir).matching {
            include "data/hexcasting/advancement/**/*.json"
        }.files.each { file ->
            def json = jsonSlurper.parseText(file.getText("UTF-8"))
            if (json instanceof Map) {
                if (json.display instanceof Map && json.display.icon != null) {
                    fixItemStackLike(json.display.icon)
                }
                if (json.criteria instanceof Map) {
                    fixItemPredicates(json.criteria)
                }
                rewrite(file, json)
            }
        }

        fileTree(resourcesDir).matching {
            include "data/create/**"
        }.files.each { it.delete() }

        fileTree(resourcesDir).matching {
            include "data/hexcasting/recipe/compat/**/*.json"
        }.files.each { it.delete() }

        // slate loot 1.21: copy_components вместо удалённого copy_nbt
        def slateLoot = new File(resourcesDir, "data/hexcasting/loot_table/blocks/slate.json")
        if (slateLoot.exists()) {
            def correct = [
                pools: [
                    [
                        rolls: 1.0,
                        bonus_rolls: 0.0,
                        entries: [
                            [
                                type: "minecraft:item",
                                name: "hexcasting:slate",
                                functions: [
                                    [
                                        function: "minecraft:copy_components",
                                        source: "block_entity",
                                        include: ["minecraft:block_entity_data"]
                                    ]
                                ]
                            ]
                        ]
                    ]
                ],
                random_sequence: "hexcasting:blocks/slate"
            ]
            rewrite(slateLoot, correct)
        }

        ["amethyst", "aventurine", "citrine"].each { variant ->
            def leavesLoot = new File(resourcesDir, "data/hexcasting/loot_table/blocks/${variant}_edified_leaves.json")
            if (leavesLoot.exists()) {
                def json = jsonSlurper.parseText(leavesLoot.getText("UTF-8"))
                json.pools?.each { pool ->
                    if (pool instanceof Map) pool.remove("conditions")
                }
                rewrite(leavesLoot, json)
            }
        }

        removeEmptyDirs(resourcesDir)
    }
}

publishing {
    publications {
        register("maven", MavenPublication) {
            from components.java
            groupId = mod_group
            artifactId = "meowhex-neoforged"
            version = mod_version
        }
    }
}
