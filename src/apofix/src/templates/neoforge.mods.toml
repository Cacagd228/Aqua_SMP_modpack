modLoader="javafml"
loaderVersion="[2,)"
license="MIT"

[[mods]]
modId="${modid}"
version="${version}"
displayName="${modName}"
authors="${author}"
description='''${desc}'''

[[dependencies.${modid}]]
    modId="minecraft"
    type="required"
    versionRange="[${mcVersion},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${modid}]]
    modId="neoforge"
    type="required"
    versionRange="[${forgeVersion},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${modid}]]
    modId="placebo"
    type="required"
    versionRange="[${placeboVersion},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${modid}]]
    modId="apothic_attributes"
    type="required"
    versionRange="[${attributeslibVersion},)"
    ordering="AFTER"
    side="BOTH"
