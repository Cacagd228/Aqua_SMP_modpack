modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

# NOTE: keep this file ASCII-only. ProcessResources runs Groovy templating with the
# platform charset, so non-ASCII comments can end up mojibake'd inside the jar.

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# Create Aeronautics is distributed as a jar-in-jar bundle whose outer modId is
# "aeronautics_bundled"; the inner mods register as simulated / aeronautics /
# offroad. Sable and Veil come in as separate mods (sable is a hard dependency of
# the whole Simulated stack, veil provides the packet + render hooks we patch).
[[dependencies.${mod_id}]]
modId = "aeronautics_bundled"
type = "required"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "simulated"
type = "required"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "aeronautics"
type = "required"
versionRange = "[1.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "[2.0.0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "veil"
type = "required"
versionRange = "[4.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "aerofix.mixins.json"
