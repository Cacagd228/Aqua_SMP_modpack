plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// JAR-ы в libs/ нужны ТОЛЬКО на этапе компиляции (compileOnly) — в итоговый мод они не попадают.
// Туда кладутся распакованные из bundle-мода inner-jar'ы (aeronautics / offroad / simulated 1.3.2),
// а также Create, Sable и Veil — их сигнатуры нужны, чтобы скомпилировать миксины.
dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'org.jetbrains:annotations:23.0.0'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
